<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hair by Nushy - Fabulaze Hair & Beauty</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Montserrat:ital,wght@0,300;0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    
    <style>
        .brand-script { font-family: 'Alex Brush', cursive; }
        body { font-family: 'Montserrat', sans-serif; background-color: #000000; overflow-x: hidden; }
    </style>
    <script>
        tailwind.config = { theme: { extend: { colors: { gold: '#E2B94F', darkBg: '#000000', cardBg: '#121212', accentGray: '#333333', textColor: '#F3F3F3' } } } }
        
        function toggleMobileMenu() { document.getElementById('mobileMenu').classList.toggle('hidden'); }
        function toggleDropdown(id) { document.getElementById(id).classList.toggle('hidden'); }
        
        let currentSlide = 0;
        function showSlide(index) {
            const track = document.getElementById('nushyTrack');
            const slides = track.children.length;
            if (index >= slides) currentSlide = 0;
            else if (index < 0) currentSlide = slides - 1;
            else currentSlide = index;
            track.style.transform = `translateX(-${currentSlide * 100}%)`;
        }
        function nextSlide() { showSlide(currentSlide + 1); }
        function prevSlide() { showSlide(currentSlide - 1); }
    </script>
</head>
<body class="text-textColor antialiased min-h-screen bg-black">

    <div class="w-full bg-darkBg min-h-screen flex flex-col">
        <!-- HEADER -->
        <header class="w-full p-6 border-b border-accentGray bg-black sticky top-0 z-50">
            <div class="max-w-7xl mx-auto flex items-center justify-between">
                <a href="index.html" class="brand-script text-4xl text-gold tracking-wide select-none block">Fabulaze Hair & Beauty</a>
                <nav class="hidden lg:flex items-center gap-8 text-xs font-semibold tracking-wider uppercase">
                    <a href="index.html" class="hover:text-gold">Home</a>
                    <a href="hair-by-nushy.html" class="text-gold">Hair by Nushy</a>
                    <a href="contact.html" class="hover:text-gold">Contact Us</a>
                </nav>
            </div>
        </header>

        <!-- MAIN -->
        <main class="flex-grow w-full">
            <section class="relative w-full h-[300px] lg:h-[400px] border-b border-accentGray flex items-center justify-center overflow-hidden">
                <div class="absolute inset-0 bg-zinc-900"></div>
                <h2 class="relative z-10 text-gold font-bold text-4xl lg:text-5xl uppercase tracking-wider">Hair by Nushy</h2>
            </section>

            <div class="max-w-7xl mx-auto px-6 py-16 space-y-16">
                <div class="flex flex-col lg:flex-row gap-12 items-start">
                    <div class="w-full lg:w-5/12 space-y-6">
                        <h2 class="brand-script text-5xl text-gold">Junior Hair Stylist</h2>
                        <p class="text-sm text-zinc-300 leading-relaxed">Dedicated to fresh styles and precision care. Book your appointment with Nushy today for a personalized hair experience.</p>
                        <a href="https://shorturl.at/LnIBF" target="_blank" class="inline-block bg-gold text-black px-8 py-3 rounded font-bold text-xs uppercase hover:bg-white transition-colors">Book Now</a>
                    </div>

                    <!-- Lookbook -->
                    <div class="w-full lg:w-7/12 relative aspect-video bg-zinc-900 border border-accentGray rounded-xl overflow-hidden">
                        <div id="nushyTrack" class="w-full h-full flex transition-transform duration-700">
                            <div class="w-full h-full flex-shrink-0"><img src="Nushy1.jfif" class="w-full h-full object-cover"></div>
                            <div class="w-full h-full flex-shrink-0"><img src="Nushy2.jfif" class="w-full h-full object-cover"></div>
                            <div class="w-full h-full flex-shrink-0"><img src="Nushy3.jfif" class="w-full h-full object-cover"></div>
                        </div>
                        <button onclick="prevSlide()" class="absolute left-4 top-1/2 -translate-y-1/2 bg-black/70 p-2 text-gold">&#10094;</button>
                        <button onclick="nextSlide()" class="absolute right-4 top-1/2 -translate-y-1/2 bg-black/70 p-2 text-gold">&#10095;</button>
                    </div>
                </div>
            </div>
        </main>

        <footer class="w-full p-8 bg-black border-t border-accentGray text-center space-y-4">
            <h3 class="brand-script text-4xl text-gold">Fabulaze Hair & Beauty</h3>
        </footer>
    </div>
</body>
</html>
